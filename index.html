
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flurry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Kranky&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
  <a href="./shelf.html" class="shelf-button">
    My Shelf ❄️
  </a>

  <main>
    <img src="./images/title.png"
         alt="Flurry"
         class="site-title">

    <p>Freeze your favorite moments.</p>

    <!-- Interactive snow globe -->
    <div class="globe" id="globe">

      <img class="globe-photo hole1" id="hole1" alt="">
      <img class="globe-photo hole2" id="hole2" alt="">
      <img class="globe-photo hole3" id="hole3" alt="">

      <img src="./images/snowglobe-template.png"
           class="globe-art"
           alt="Snow globe">

      <button id="snowglobeButton"
              class="globe-click"
              aria-label="Upload a video"></button>
    </div>

    <!-- Hidden file picker -->
    <input type="file"
           id="upload"
           accept="video/*,.mov">

    <label for="rotation">Rotate:</label>
    <select id="rotation">
      <option value="0">Normal</option>
      <option value="90">90° clockwise</option>
      <option value="180">180°</option>
      <option value="270">90° counterclockwise</option>
    </select>

    <p id="status">Click the snow globe to upload a video!</p>

    <!-- Choose 3 photos -->
    <div id="selectionArea" hidden>
      <h2>Choose your 3 favorite moments!</h2>
      <p id="counter">0 / 3 selected</p>

      <div id="gallery"></div>

      <button id="done" disabled>Done!</button>
    </div>

    <!-- Save completed globe -->
    <div id="finalArea" hidden>
      <h2>Your frozen moments! ❄️</h2>

      <button id="saveSnowglobe">
        Save to My Shelf ❄️
      </button>

      <button id="back">Choose Again</button>
    </div>
  </main>

  <script>
    const upload = document.getElementById("upload");
    const rotation = document.getElementById("rotation");
    const status = document.getElementById("status");

    const globe = document.getElementById("globe");
    const globeButton = document.getElementById("snowglobeButton");

    const selectionArea = document.getElementById("selectionArea");
    const gallery = document.getElementById("gallery");
    const counter = document.getElementById("counter");
    const done = document.getElementById("done");

    const finalArea = document.getElementById("finalArea");
    const back = document.getElementById("back");
    const saveButton = document.getElementById("saveSnowglobe");

    let candidates = [];
    let selected = [];
    let processing = false;

    // Click the snow globe to upload a video
    globeButton.onclick = () => upload.click();

    // Sharpness: variance of the Laplacian
    function sharpness(ctx, width, height) {
      const pixels = ctx.getImageData(
        0, 0, width, height
      ).data;

      const gray = new Float32Array(width * height);

      for (let i = 0; i < gray.length; i++) {
        const p = i * 4;

        gray[i] =
          0.299 * pixels[p] +
          0.587 * pixels[p + 1] +
          0.114 * pixels[p + 2];
      }

      let sum = 0;
      let sumSquares = 0;
      let count = 0;

      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const i = y * width + x;

          const value =
            4 * gray[i] -
            gray[i - 1] -
            gray[i + 1] -
            gray[i - width] -
            gray[i + width];

          sum += value;
          sumSquares += value * value;
          count++;
        }
      }

      const mean = sum / count;
      return sumSquares / count - mean * mean;
    }

    // Crop frame to a centered square with rotation
    function drawSquare(video, ctx, canvas) {
      const width = video.videoWidth;
      const height = video.videoHeight;

      const size = Math.min(width, height);
      const cropX = (width - size) / 2;
      const cropY = (height - size) / 2;

      const angle = Number(rotation.value) * Math.PI / 180;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(angle);

      ctx.drawImage(
        video,
        cropX, cropY, size, size,
        -canvas.width / 2,
        -canvas.height / 2,
        canvas.width,
        canvas.height
      );

      ctx.restore();
    }

    // Seek to a timestamp
    function seek(video, time) {
      return new Promise((resolve, reject) => {
        const onSeeked = () => {
          cleanup();
          resolve();
        };

        const onError = () => {
          cleanup();
          reject(new Error("Could not read video frame"));
        };

        function cleanup() {
          video.removeEventListener("seeked", onSeeked);
          video.removeEventListener("error", onError);
        }

        video.addEventListener("seeked", onSeeked);
        video.addEventListener("error", onError);

        video.currentTime = time;
      });
    }

    async function processVideo() {
      const file = upload.files[0];
      if (!file || processing) return;

      processing = true;
      upload.disabled = true;
      rotation.disabled = true;

      candidates = [];
      selected = [];

      gallery.innerHTML = "";
      selectionArea.hidden = true;
      finalArea.hidden = true;

      updateGlobe();
      status.textContent = "Finding your best moments...";

      const video = document.createElement("video");
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      const url = URL.createObjectURL(file);

      try {
        video.src = url;

        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = () =>
            reject(new Error("Cannot load video"));
        });

        const duration = video.duration;
        const size = Math.min(
          video.videoWidth,
          video.videoHeight
        );

        if (!Number.isFinite(duration) ||
            duration <= 0 || size <= 0) {
          throw new Error("Invalid video");
        }

        // Small canvas to measure sharpness
        const scoreCanvas = document.createElement("canvas");
        scoreCanvas.width = 256;
        scoreCanvas.height = 256;

        const scoreCtx = scoreCanvas.getContext("2d", {
          willReadFrequently: true
        });

        // Large canvas for final images
        const fullCanvas = document.createElement("canvas");
        fullCanvas.width = size;
        fullCanvas.height = size;

        const fullCtx = fullCanvas.getContext("2d");
        const frames = [];

        // Sample 30 frames
        for (let i = 0; i < 30; i++) {
          const time = duration * (i + 1) / 31;

          await seek(video, time);
          drawSquare(video, scoreCtx, scoreCanvas);

          frames.push({
            time,
            score: sharpness(scoreCtx, 256, 256)
          });
        }

        // Sharpest first
        frames.sort((a, b) => b.score - a.score);

        const chosen = [];

        // Prefer frames spaced apart
        for (const frame of frames) {
          if (chosen.every(other =>
            Math.abs(other.time - frame.time) >=
            duration * 0.06
          )) {
            chosen.push(frame);
          }

          if (chosen.length === 10) break;
        }

        // Fill remaining slots if needed
        for (const frame of frames) {
          if (chosen.length === 10) break;
          if (!chosen.includes(frame)) chosen.push(frame);
        }

        chosen.sort((a, b) => a.time - b.time);

        // Extract final 10 images in high resolution
        for (const frame of chosen) {
          await seek(video, frame.time);
          drawSquare(video, fullCtx, fullCanvas);

          candidates.push({
            time: frame.time,
            image: fullCanvas.toDataURL("image/png")
          });
        }

        displayGallery();

        selectionArea.hidden = false;
        status.textContent = "Pick your favorite 3!";

      } catch (error) {
        console.error(error);
        status.textContent = error.message;

      } finally {
        URL.revokeObjectURL(url);
        upload.disabled = false;
        rotation.disabled = false;
        processing = false;
      }
    }

    // Display 10 clickable images
    function displayGallery() {
      gallery.innerHTML = "";

      candidates.forEach((frame, index) => {
        const img = document.createElement("img");

        img.src = frame.image;
        img.alt = "Moment " + (index + 1);
        img.className = "photo";

        img.onclick = () => toggleFrame(index);

        gallery.appendChild(img);
      });

      updateSelection();
    }

    function toggleFrame(index) {
      if (selected.includes(index)) {
        selected = selected.filter(i => i !== index);
      } else {
        if (selected.length >= 3) return;
        selected.push(index);
      }

      updateSelection();
      updateGlobe();
    }

    // Place selected photos inside the globe
    function updateGlobe() {
      const holes = [
        document.getElementById("hole1"),
        document.getElementById("hole2"),
        document.getElementById("hole3")
      ];

      holes.forEach((hole, i) => {
        if (i < selected.length && candidates[selected[i]]) {
          hole.src = candidates[selected[i]].image;
          hole.style.display = "block";
        } else {
          hole.removeAttribute("src");
          hole.style.display = "none";
        }
      });
    }

    function updateSelection() {
      const images = gallery.querySelectorAll("img");

      images.forEach((img, index) => {
        img.classList.toggle(
          "selected",
          selected.includes(index)
        );
      });

      counter.textContent = selected.length + " / 3 selected";
      done.disabled = selected.length !== 3;
    }

    // Finalize the globe
    done.onclick = () => {
      if (selected.length !== 3) return;

      updateGlobe();

      // Hide the 10 candidate images
      selectionArea.hidden = true;

      // Show save controls
      finalArea.hidden = false;

      status.textContent = "Your moments are frozen!";
    };

    // Choose different photos
    back.onclick = () => {
      finalArea.hidden = true;
      selectionArea.hidden = false;
      status.textContent = "Pick your favorite 3!";
    };

    // Save the actual globe as a snapshot
    saveButton.onclick = async () => {
      if (selected.length !== 3) return;

      saveButton.disabled = true;
      status.textContent = "Saving your snow globe...";

      try {
        if (typeof html2canvas !== "function") {
          throw new Error("Screenshot library did not load.");
        }

        // Wait for the three globe images to be ready
        await Promise.all(
          ["hole1", "hole2", "hole3"].map(id => {
            const img = document.getElementById(id);
            return img.decode();
          })
        );

        // Capture the globe only
        const screenshot = await html2canvas(globe, {
          backgroundColor: null,
          scale: 1,
          useCORS: true
        });

        // Resize to save browser storage
        const canvas = document.createElement("canvas");
        canvas.width = 420;
        canvas.height = Math.round(
          420 * screenshot.height / screenshot.width
        );

        canvas.getContext("2d").drawImage(
          screenshot,
          0, 0,
          canvas.width,
          canvas.height
        );

        const image = canvas.toDataURL("image/png");

        const memories = JSON.parse(
          localStorage.getItem("flurryMemories") || "[]"
        );

        memories.push({
          id: Date.now(),
          image: image,
          createdAt: new Date().toISOString()
        });

        localStorage.setItem(
          "flurryMemories",
          JSON.stringify(memories)
        );

        // Go to the shelf
        window.location.href = "./shelf.html";

      } catch (error) {
        console.error(error);
        status.textContent = "Could not save the snow globe.";
        alert(error.message);
        saveButton.disabled = false;
      }
    };

    upload.addEventListener("change", processVideo);
    rotation.addEventListener("change", processVideo);

    // Falling snow
    for (let i = 0; i < 60; i++) {
      const snowflake = document.createElement("div");
      snowflake.className = "snowflake";

      const size = Math.random() * 5 + 2;
      const duration = Math.random() * 8 + 6;

      snowflake.style.width = size + "px";
      snowflake.style.height = size + "px";
      snowflake.style.left = Math.random() * 100 + "vw";
      snowflake.style.animationDuration = duration + "s";
      snowflake.style.animationDelay =
        -Math.random() * duration + "s";
      snowflake.style.opacity =
        Math.random() * 0.5 + 0.5;

      document.body.appendChild(snowflake);
    }
  </script>
</body>
</html>
