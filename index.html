<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flurry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Kranky&display=swap" rel="stylesheet">

  <style>
    h1 {
      font-family: 'Kranky', serif;
    }

    body {
      font-family: 'Crafty Girls', cursive;
    }

    .photo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      cursor: pointer;
      margin: 5px;
      border: 4px solid transparent;
    }

    .photo.selected {
      border-color: dodgerblue;
    }

    #gallery, #finalFrames {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
  </style>
</head>

<body>
  <img src="./images/title.png" alt="Flurry" class="site-title">
  <p>Freeze your favorite moments.</p>

  <input type="file" id="upload" accept="video/*,.mov">

  <label>Rotate:</label>
  <select id="rotation">
    <option value="0">Normal</option>
    <option value="90">90° clockwise</option>
    <option value="180">180°</option>
    <option value="270">90° counterclockwise</option>
  </select>

  <p id="status"></p>

  <div id="selectionArea" hidden>
    <h2>Choose your 3 favorite moments</h2>
    <p id="counter">0 / 3 selected</p>

    <div id="gallery"></div>

    <button id="done" disabled>Done</button>
  </div>

  <div id="finalArea" hidden>
    <h2>Your frozen moments!</h2>
    <div id="finalFrames"></div>
    <button id="back">Choose Again</button>
  </div>

  <script>
    const upload = document.getElementById("upload");
    const rotation = document.getElementById("rotation");
    const status = document.getElementById("status");

    const selectionArea = document.getElementById("selectionArea");
    const gallery = document.getElementById("gallery");
    const counter = document.getElementById("counter");
    const done = document.getElementById("done");

    const finalArea = document.getElementById("finalArea");
    const finalFrames = document.getElementById("finalFrames");
    const back = document.getElementById("back");

    let candidates = [];
    let selected = [];
    let processing = false;

    // Calculate sharpness using Laplacian variance
    function sharpness(ctx, width, height) {
      const pixels = ctx.getImageData(
        0, 0, width, height
      ).data;

      const gray = new Float32Array(width * height);

      for (let i = 0; i < gray.length; i++) {
        const p = i * 4;

        gray[i] =
          0.299 * pixels[p] +
          0.587 * pixels[p + 1] +
          0.114 * pixels[p + 2];
      }

      let sum = 0;
      let sumSquares = 0;
      let count = 0;

      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const i = y * width + x;

          const value =
            4 * gray[i] -
            gray[i - 1] -
            gray[i + 1] -
            gray[i - width] -
            gray[i + width];

          sum += value;
          sumSquares += value * value;
          count++;
        }
      }

      const mean = sum / count;

      return sumSquares / count - mean * mean;
    }

    // Draw the largest possible centered square
    function drawSquare(video, ctx, canvas) {
      const width = video.videoWidth;
      const height = video.videoHeight;

      const size = Math.min(width, height);
      const cropX = (width - size) / 2;
      const cropY = (height - size) / 2;

      const angle = Number(rotation.value) * Math.PI / 180;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(angle);

      ctx.drawImage(
        video,
        cropX, cropY,
        size, size,
        -canvas.width / 2,
        -canvas.height / 2,
        canvas.width,
        canvas.height
      );

      ctx.restore();
    }

    // Move to a specific time in the video
    function seek(video, time) {
      return new Promise((resolve, reject) => {
        video.onseeked = () => resolve();
        video.onerror = () => reject(
          new Error("Could not read video frame")
        );

        video.currentTime = time;
      });
    }

    async function processVideo() {
      const file = upload.files[0];
      if (!file || processing) return;

      processing = true;
      upload.disabled = true;
      rotation.disabled = true;

      candidates = [];
      selected = [];

      gallery.innerHTML = "";
      finalFrames.innerHTML = "";

      selectionArea.hidden = true;
      finalArea.hidden = true;

      status.textContent = "Finding your best moments...";

      const video = document.createElement("video");
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      const url = URL.createObjectURL(file);

      try {
        video.src = url;

        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = () => reject(
            new Error("Cannot load video")
          );
        });

        const duration = video.duration;
        const size = Math.min(
          video.videoWidth,
          video.videoHeight
        );

        if (!Number.isFinite(duration) ||
            duration <= 0 || size <= 0) {
          throw new Error("Invalid video");
        }

        // Small canvas for sharpness analysis
        const scoreCanvas = document.createElement("canvas");
        scoreCanvas.width = 256;
        scoreCanvas.height = 256;

        const scoreCtx = scoreCanvas.getContext("2d", {
          willReadFrequently: true
        });

        // Full-resolution canvas for images
        const fullCanvas = document.createElement("canvas");
        fullCanvas.width = size;
        fullCanvas.height = size;

        const fullCtx = fullCanvas.getContext("2d");

        const frames = [];

        // Analyze 30 frames throughout the video
        for (let i = 0; i < 30; i++) {
          const time = duration * (i + 1) / 31;

          await seek(video, time);

          drawSquare(video, scoreCtx, scoreCanvas);

          frames.push({
            time,
            score: sharpness(scoreCtx, 256, 256)
          });
        }

        // Rank frames by sharpness
        frames.sort((a, b) => b.score - a.score);

        // Pick 10 sharp frames spaced apart
        const chosen = [];

        for (const frame of frames) {
          const farEnough = chosen.every(other =>
            Math.abs(other.time - frame.time) >=
            duration * 0.06
          );

          if (farEnough) {
            chosen.push(frame);
          }

          if (chosen.length === 10) break;
        }

        // Fallback if fewer than 10 were selected
        for (const frame of frames) {
          if (chosen.length === 10) break;
          if (!chosen.includes(frame)) chosen.push(frame);
        }

        // Display candidates in chronological order
        chosen.sort((a, b) => a.time - b.time);

        // Extract full-quality images
        for (const frame of chosen) {
          await seek(video, frame.time);

          drawSquare(video, fullCtx, fullCanvas);

          candidates.push({
            time: frame.time,
            image: fullCanvas.toDataURL("image/png")
          });
        }

        displayGallery();

        selectionArea.hidden = false;
        status.textContent = "Pick your favorite 3!";

      } catch (error) {
        console.error(error);
        status.textContent = error.message;
      } finally {
        URL.revokeObjectURL(url);
        upload.disabled = false;
        rotation.disabled = false;
        processing = false;
      }
    }

    // Display 10 clickable photos
    function displayGallery() {
      gallery.innerHTML = "";

      candidates.forEach((frame, index) => {
        const img = document.createElement("img");

        img.src = frame.image;
        img.className = "photo";
        img.alt = "Moment " + (index + 1);

        img.onclick = () => toggleFrame(index);

        gallery.appendChild(img);
      });

      updateSelection();
    }

    // Select or deselect a frame
    function toggleFrame(index) {
      if (selected.includes(index)) {
        selected = selected.filter(i => i !== index);
      } else {
        if (selected.length >= 3) return;
        selected.push(index);
      }

      updateSelection();
    }

    // Update outlines, counter, and Done button
    function updateSelection() {
      const images = gallery.querySelectorAll("img");

      images.forEach((img, index) => {
        img.classList.toggle(
          "selected",
          selected.includes(index)
        );
      });

      counter.textContent = selected.length + " / 3 selected";
      done.disabled = selected.length !== 3;
    }

    // Finalize the chosen 3 frames
    done.onclick = () => {
      if (selected.length !== 3) return;

      finalFrames.innerHTML = "";

      // Show final photos in chronological order
      const finalSelection = [...selected].sort((a, b) => a - b);

      finalSelection.forEach(index => {
        const img = document.createElement("img");

        img.src = candidates[index].image;
        img.width = 250;
        img.height = 250;

        finalFrames.appendChild(img);
      });

      selectionArea.hidden = true;
      finalArea.hidden = false;

      status.textContent = "Your moments are frozen!";
    };

    // Go back and change the selected frames
    back.onclick = () => {
      finalArea.hidden = true;
      selectionArea.hidden = false;
      status.textContent = "Pick your favorite 3!";
    };

    upload.addEventListener("change", processVideo);
    rotation.addEventListener("change", processVideo);
  </script>
</body>
</html>
