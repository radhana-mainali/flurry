<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flurry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Kranky&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./images/favicon.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="home-page">

  <main>
    <!-- Flurry title!!!-->
    <img
      src="./images/trimmed/title.png"
      alt="Flurry"
      class="site-title"
    >

    <!-- Shelf button directly under title -->
    <a href="./shelf.html" class="shelf-button">
      My Shelf
    </a>

    <p class="tagline">Freeze your favorite moments.</p>

    <!-- The globe, with the 10 moments (and later the stickers)
         floating around it -->
    <div class="globe-stage" id="globeStage">

    <!-- Interactive snow globe -->
    <div class="globe" id="globe">

      <!-- Selected photos -->
      <img class="globe-photo hole1" id="hole1" alt="">
      <img class="globe-photo hole2" id="hole2" alt="">
      <img class="globe-photo hole3" id="hole3" alt="">

      <!-- Snow globe illustration -->
      <img
        src="./images/trimmed/snowglobe.png"
        class="globe-art"
        alt="Snow globe"
      >

      <!-- Video clip that plays inside a photo opening when shaken -->
      <div class="globe-video">
        <video playsinline preload="auto"></video>
      </div>

      <!-- Date stamp (tape + typewriter date) -->
      <div id="dateLayer" class="date-layer"></div>

      <!-- Snow that swirls inside the glass when shaken -->
      <canvas class="globe-snow"></canvas>

      <!-- Click globe to upload -->
      <button
        id="snowglobeButton"
        class="globe-click"
        aria-label="Upload a video"
      ></button>

      <!-- Stickers on top of the glass -->
      <div id="stickerLayer" class="sticker-layer"></div>

    </div>

      <!-- 10 suggested moments float around the globe: pick 3 -->
      <div id="gallery" class="float-ring" hidden></div>

      <!-- The team's stickers float around the globe: peel one off -->
      <div id="stickerTray" class="float-ring sticker-ring" hidden
           aria-label="Stickers"></div>
    </div>

    <!-- Hidden video upload -->
    <input
      type="file"
      id="upload"
      accept="video/*,.mov"
    >

    <!-- Rotation controls -->
    <div class="rotation-controls" id="rotationControls">
      <label for="rotation">Rotate:</label>

      <select id="rotation">
        <option value="0">Normal</option>
        <option value="90">90° clockwise</option>
        <option value="180">180°</option>
        <option value="270">90° counterclockwise</option>
      </select>
    </div>

    <p id="status">Click the snow globe to upload a video!</p>

    <!-- Select 3 of 10 suggested frames -->
    <div id="selectionArea" hidden>
      <span id="counter">0 / 3 picked</span>
      <button id="done" disabled>Done!</button>
    </div>

    <!-- Completed snow globe actions -->
    <div id="finalArea" hidden>

      <!-- A label on pink tape: the date to start with, but you can
           write anything -->
      <div class="decorate-row">
        <label class="date-toggle">
          <input type="checkbox" id="dateOn" checked>
          add a label
        </label>
        <input type="text" id="dateText" maxlength="22"
               aria-label="Label text" spellcheck="false">
      </div>

      <div class="decorate-row">
        <button id="shakeButton" class="soft-button">Shake</button>
        <button id="saveSnowglobe" class="soft-button">Save to My Shelf</button>
        <button id="back" class="soft-button">Choose Again</button>
      </div>

      <p class="hint" id="shakeHint">peel a sticker onto the globe, or drag the globe side to side to shake it!</p>
    </div>
  </main>

  <script src="./js/flurry-globe.js"></script>
  <script src="./js/flurry-store.js"></script>
  <script src="./js/flurry-shake.js"></script>
  <script src="./js/flurry-music.js"></script>
  <script src="./js/home.js"></script>
</body>
</html>
