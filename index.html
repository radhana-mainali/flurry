
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Kranky&display=swap" rel="stylesheet">

  <style>
    h1 {
      font-family: 'Kranky', serif;
    }

    body {
      font-family: 'Crafty Girls', cursive;
    }
  </style>
</head>

<body>
  <h1>Flurry</h1>

  <input type="file" id="upload" accept="video/*,.mov">

  <label for="rotation">Rotate:</label>
  <select id="rotation">
    <option value="0">Normal</option>
    <option value="90">90° clockwise</option>
    <option value="180">180°</option>
    <option value="270">90° counterclockwise</option>
  </select>

  <p id="status"></p>
  <div id="frames"></div>

  <script>
    const upload = document.getElementById("upload");
    const rotation = document.getElementById("rotation");
    const status = document.getElementById("status");
    const output = document.getElementById("frames");

    // Measure frame sharpness using Laplacian variance
    function sharpness(ctx, width, height) {
      const pixels = ctx.getImageData(0, 0, width, height).data;
      const gray = new Float32Array(width * height);

      for (let i = 0; i < gray.length; i++) {
        const p = i * 4;
        gray[i] =
          0.299 * pixels[p] +
          0.587 * pixels[p + 1] +
          0.114 * pixels[p + 2];
      }

      let sum = 0;
      let sumSquares = 0;
      let count = 0;

      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const i = y * width + x;

          const value =
            4 * gray[i] -
            gray[i - 1] -
            gray[i + 1] -
            gray[i - width] -
            gray[i + width];

          sum += value;
          sumSquares += value * value;
          count++;
        }
      }

      const mean = sum / count;
      return sumSquares / count - mean * mean;
    }

    async function processVideo() {
      const file = upload.files[0];
      if (!file) return;

      output.innerHTML = "";
      status.textContent = "Processing video...";
      upload.disabled = true;
      rotation.disabled = true;

      const video = document.createElement("video");
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      const url = URL.createObjectURL(file);

      try {
        video.src = url;

        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = () =>
            reject(new Error("Cannot load video"));
        });

        const duration = video.duration;
        const width = video.videoWidth;
        const height = video.videoHeight;

        if (!Number.isFinite(duration) ||
            duration <= 0 || !width || !height) {
          throw new Error("Invalid video");
        }

        const squareSize = Math.min(width, height);
        const cropX = (width - squareSize) / 2;
        const cropY = (height - squareSize) / 2;

        // Small canvas for sharpness scoring
        const scoreCanvas = document.createElement("canvas");
        scoreCanvas.width = 256;
        scoreCanvas.height = 256;

        const scoreCtx = scoreCanvas.getContext("2d", {
          willReadFrequently: true
        });

        // High-resolution canvas for final photos
        const fullCanvas = document.createElement("canvas");
        fullCanvas.width = squareSize;
        fullCanvas.height = squareSize;

        const fullCtx = fullCanvas.getContext("2d");

        function drawSquare(ctx, canvas) {
          const angle = Number(rotation.value) * Math.PI / 180;

          ctx.save();
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(angle);

          ctx.drawImage(
            video,
            cropX, cropY,
            squareSize, squareSize,
            -canvas.width / 2,
            -canvas.height / 2,
            canvas.width,
            canvas.height
          );

          ctx.restore();
        }

        function seek(time) {
          return new Promise((resolve, reject) => {
            video.onseeked = resolve;
            video.onerror = () =>
              reject(new Error("Could not seek video"));
            video.currentTime = time;
          });
        }

        const candidates = [];

        // Sample 15 frames
        for (let i = 0; i < 15; i++) {
          const time = duration * (i + 1) / 16;

          await seek(time);
          drawSquare(scoreCtx, scoreCanvas);

          candidates.push({
            time,
            score: sharpness(scoreCtx, 256, 256)
          });
        }

        // Rank by sharpness
        candidates.sort((a, b) => b.score - a.score);

        const selected = [];

        // Choose 3 frames spaced apart
        for (const frame of candidates) {
          if (selected.every(other =>
            Math.abs(other.time - frame.time) >=
            duration * 0.15
          )) {
            selected.push(frame);
          }

          if (selected.length === 3) break;
        }

        selected.sort((a, b) => a.time - b.time);

        // Export 3 full-resolution square images
        for (const frame of selected) {
          await seek(frame.time);
          drawSquare(fullCtx, fullCanvas);

          const img = document.createElement("img");
          img.src = fullCanvas.toDataURL("image/png");
          img.width = 250;
          img.height = 250;

          output.appendChild(img);
        }

        status.textContent = "Done!";

      } catch (error) {
        console.error(error);
        status.textContent = error.message;
      } finally {
        upload.disabled = false;
        rotation.disabled = false;
        URL.revokeObjectURL(url);
      }
    }

    upload.addEventListener("change", processVideo);
    rotation.addEventListener("change", processVideo);
  </script>
</body>
</html>
