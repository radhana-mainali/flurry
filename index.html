
<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flurry</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Kranky&display=swap" rel="stylesheet">

  <!-- Our CSS file -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main>
    <!-- Flurry logo -->
    <img
      src="./images/title.png"
      alt="Flurry"
      class="site-title"
    >

    <p>Freeze your favorite moments.</p>

    <!-- Snowglobe button -->
    
    <div class="globe" id="globe">
    
      <!-- Photos appear behind the globe -->
      <img class="globe-photo hole1" id="hole1">
      <img class="globe-photo hole2" id="hole2">
      <img class="globe-photo hole3" id="hole3">
    
      <!-- Snow globe artwork sits on top -->
      <img
        src="./images/snowglobe-template.png"
        class="globe-art"
        alt="Snow globe"
      >
    
      <!-- Clicking globe opens video upload -->
      <button
        id="snowglobeButton"
        class="globe-click"
        aria-label="Upload a video"
      ></button>
    
    </div>

    <!-- Video upload -->
    <input
      type="file"
      id="upload"
      accept="video/*,.mov"
    >

    <!-- Rotation -->
    <label for="rotation">Rotate:</label>
    <select id="rotation">
      <option value="0">Normal</option>
      <option value="90">90° clockwise</option>
      <option value="180">180°</option>
      <option value="270">90° counterclockwise</option>
    </select>

    <p id="status"></p>

    <!-- Choose 3 out of 10 -->
    <div id="selectionArea" hidden>
      <h2>Choose your 3 favorite moments!</h2>
      <p id="counter">0 / 3 selected</p>

      <div id="gallery"></div>

      <button id="done" disabled>Done!</button>
    </div>

    <!-- Final 3 images -->
    <div id="finalArea" hidden>
        <h2>Your frozen moments!</h2>

        <div id="finalFrames"></div>

        <button id="saveSnowglobe">Save to my shelf ❄️</button>

        <button id="back">Choose Again</button>
    </div>
  </main>

  <script>
    const upload = document.getElementById("upload");
    const rotation = document.getElementById("rotation");
    const status = document.getElementById("status");

    const snowglobeButton =
      document.getElementById("snowglobeButton");

    const selectionArea =
      document.getElementById("selectionArea");

    const gallery = document.getElementById("gallery");
    const counter = document.getElementById("counter");
    const done = document.getElementById("done");

    const finalArea = document.getElementById("finalArea");
    const finalFrames = document.getElementById("finalFrames");
    const back = document.getElementById("back");

    let candidates = [];
    let selected = [];
    let processing = false;

    // Click snowglobe to upload a video
    snowglobeButton.onclick = () => upload.click();

    // Calculate sharpness with Laplacian variance
    function sharpness(ctx, width, height) {
      const pixels = ctx.getImageData(
        0, 0, width, height
      ).data;

      const gray = new Float32Array(width * height);

      for (let i = 0; i < gray.length; i++) {
        const p = i * 4;

        gray[i] =
          0.299 * pixels[p] +
          0.587 * pixels[p + 1] +
          0.114 * pixels[p + 2];
      }

      let sum = 0;
      let sumSquares = 0;
      let count = 0;

      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const i = y * width + x;

          const value =
            4 * gray[i] -
            gray[i - 1] -
            gray[i + 1] -
            gray[i - width] -
            gray[i + width];

          sum += value;
          sumSquares += value * value;
          count++;
        }
      }

      const mean = sum / count;
      return sumSquares / count - mean * mean;
    }

    // Draw a centered square with optional rotation
    function drawSquare(video, ctx, canvas) {
      const width = video.videoWidth;
      const height = video.videoHeight;

      const size = Math.min(width, height);
      const cropX = (width - size) / 2;
      const cropY = (height - size) / 2;

      const angle =
        Number(rotation.value) * Math.PI / 180;

      ctx.save();

      ctx.clearRect(
        0, 0, canvas.width, canvas.height
      );

      ctx.translate(
        canvas.width / 2,
        canvas.height / 2
      );

      ctx.rotate(angle);

      ctx.drawImage(
        video,
        cropX, cropY,
        size, size,
        -canvas.width / 2,
        -canvas.height / 2,
        canvas.width,
        canvas.height
      );

      ctx.restore();
    }

    // Seek to a timestamp in the video
    function seek(video, time) {
      return new Promise((resolve, reject) => {
        const onSeeked = () => {
          cleanup();
          resolve();
        };

        const onError = () => {
          cleanup();
          reject(new Error("Could not read video frame"));
        };

        function cleanup() {
          video.removeEventListener("seeked", onSeeked);
          video.removeEventListener("error", onError);
        }

        video.addEventListener("seeked", onSeeked);
        video.addEventListener("error", onError);

        video.currentTime = time;
      });
    }

    // Process uploaded video
    async function processVideo() {
      const file = upload.files[0];

      if (!file || processing) return;

      processing = true;
      upload.disabled = true;
      rotation.disabled = true;

      candidates = [];
      selected = [];

      gallery.innerHTML = "";
      finalFrames.innerHTML = "";

      selectionArea.hidden = true;
      finalArea.hidden = true;

      status.textContent = "Finding your best moments...";

      const video = document.createElement("video");

      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      const url = URL.createObjectURL(file);

      try {
        video.src = url;

        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;

          video.onerror = () => reject(
            new Error("Cannot load video")
          );
        });

        const duration = video.duration;

        const size = Math.min(
          video.videoWidth,
          video.videoHeight
        );

        if (
          !Number.isFinite(duration) ||
          duration <= 0 ||
          size <= 0
        ) {
          throw new Error("Invalid video");
        }

        // Small canvas for sharpness scoring
        const scoreCanvas =
          document.createElement("canvas");

        scoreCanvas.width = 256;
        scoreCanvas.height = 256;

        const scoreCtx = scoreCanvas.getContext("2d", {
          willReadFrequently: true
        });

        // Full-resolution canvas for final photos
        const fullCanvas =
          document.createElement("canvas");

        fullCanvas.width = size;
        fullCanvas.height = size;

        const fullCtx = fullCanvas.getContext("2d");

        const frames = [];

        // Analyze 30 frames throughout the video
        for (let i = 0; i < 30; i++) {
          const time = duration * (i + 1) / 31;

          await seek(video, time);

          drawSquare(video, scoreCtx, scoreCanvas);

          frames.push({
            time,
            score: sharpness(scoreCtx, 256, 256)
          });
        }

        // Sort by sharpness
        frames.sort((a, b) => b.score - a.score);

        // Choose 10 sharp, time-separated frames
        const chosen = [];

        for (const frame of frames) {
          const farEnough = chosen.every(other =>
            Math.abs(other.time - frame.time) >=
            duration * 0.06
          );

          if (farEnough) {
            chosen.push(frame);
          }

          if (chosen.length === 10) break;
        }

        // Fallback to guarantee 10 candidates
        for (const frame of frames) {
          if (chosen.length === 10) break;

          if (!chosen.includes(frame)) {
            chosen.push(frame);
          }
        }

        // Put images in chronological order
        chosen.sort((a, b) => a.time - b.time);

        // Export full-quality square images
        for (const frame of chosen) {
          await seek(video, frame.time);

          drawSquare(video, fullCtx, fullCanvas);

          candidates.push({
            time: frame.time,
            image: fullCanvas.toDataURL("image/png")
          });
        }

        displayGallery();

        selectionArea.hidden = false;
        status.textContent = "Pick your favorite 3!";

      } catch (error) {
        console.error(error);
        status.textContent = error.message;

      } finally {
        URL.revokeObjectURL(url);

        upload.disabled = false;
        rotation.disabled = false;
        processing = false;
      }
    }

    // Display 10 candidate images
    function displayGallery() {
      gallery.innerHTML = "";

      candidates.forEach((frame, index) => {
        const img = document.createElement("img");

        img.src = frame.image;
        img.className = "photo";
        img.alt = "Moment " + (index + 1);

        img.onclick = () => toggleFrame(index);

        gallery.appendChild(img);
      });

      updateSelection();
    }

    // Select or deselect an image
    function toggleFrame(index) {
      if (selected.includes(index)) {
        selected = selected.filter(i => i !== index);
      } else {
        if (selected.length >= 3) return;
        selected.push(index);
      }

      updateSelection();
    }

    // Update selected image borders
    function updateSelection() {
      const images = gallery.querySelectorAll("img");

      images.forEach((img, index) => {
        img.classList.toggle(
          "selected",
          selected.includes(index)
        );
      });

      counter.textContent =
        selected.length + " / 3 selected";

      done.disabled = selected.length !== 3;
    }

    // Show final 3 images
    done.onclick = () => {
      if (selected.length !== 3) return;

      finalFrames.innerHTML = "";

      const finalSelection =
        [...selected].sort((a, b) => a - b);

      finalSelection.forEach(index => {
        const img = document.createElement("img");

        img.src = candidates[index].image;
        img.width = 250;
        img.height = 250;

        finalFrames.appendChild(img);
      });

      selectionArea.hidden = true;
      finalArea.hidden = false;

      status.textContent = "Your moments are frozen!";
    };

    // Return to choosing images
    back.onclick = () => {
      finalArea.hidden = true;
      selectionArea.hidden = false;

      status.textContent = "Pick your favorite 3!";
    };

    upload.addEventListener("change", processVideo);
    rotation.addEventListener("change", processVideo);

    // Create falling snowflakes
    for (let i = 0; i < 60; i++) {
      const snowflake = document.createElement("div");
      snowflake.className = "snowflake";

      const size = Math.random() * 5 + 2;
      const duration = Math.random() * 8 + 6;

      snowflake.style.width = size + "px";
      snowflake.style.height = size + "px";
      snowflake.style.left = Math.random() * 100 + "vw";

      snowflake.style.animationDuration = duration + "s";
      snowflake.style.animationDelay =
        -Math.random() * duration + "s";

      snowflake.style.opacity =
        Math.random() * 0.5 + 0.5;

      document.body.appendChild(snowflake);
    }
  </script>
</body>
</html>
