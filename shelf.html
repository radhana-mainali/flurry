<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Shelf - Flurry</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Kranky&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="shelf-page">

    <!-- Custom My Shelf title image -->
    <img
      src="./images/trimmed/myshelf.png"
      alt="My Shelf"
      class="shelf-title"
    >

    <div class="shelf-actions">
      <a href="./index.html" class="shelf-button">
        Back to Flurry
      </a>

      <button id="resetShelf" class="shelf-button">
        Reset Shelf
      </button>
    </div>

    <!-- Shelf artwork -->
    <div class="shelf-stage">

      <img
        src="./images/trimmed/shelf.png"
        alt="Wooden shelves"
        class="shelf-art"
      >

      <!-- Up to 3 globes per shelf -->
      <div id="shelfRow1" class="shelf-row row-1"></div>
      <div id="shelfRow2" class="shelf-row row-2"></div>
      <div id="shelfRow3" class="shelf-row row-3"></div>

      <p id="emptyMessage" class="shelf-note" hidden>
        Your shelf is empty!<br>
        <a href="./index.html">Freeze your first moment</a>
      </p>

    </div>

    <!-- More than 9 globes: flip between shelves -->
    <nav id="shelfPager" class="shelf-pager" hidden>
      <button id="prevShelf" class="pager-link">&larr; previous shelf</button>
      <span id="pageLabel"></span>
      <button id="nextShelf" class="pager-link">next shelf &rarr;</button>
    </nav>

  </main>

  <!-- Enlarged memory -->
  <div id="memoryViewer" class="memory-viewer" hidden
       role="dialog" aria-modal="true" aria-label="Snow globe">
    <button id="closeViewer" class="soft-button">Close ✕</button>

    <!-- Live globe: photos, art, decorations, snow and video -->
    <div id="viewerGlobe" class="globe viewer-globe is-shakeable"></div>

    <div class="viewer-actions">
      <button id="viewerShake" class="soft-button">Shake</button>
    </div>

    <p id="replayNote" class="replay-note" hidden>
      This globe is a still keepsake, so it has no video to replay.
    </p>
  </div>

  <script src="./js/flurry-globe.js"></script>
  <script src="./js/flurry-store.js"></script>
  <script src="./js/flurry-shake.js"></script>
  <script src="./js/flurry-music.js"></script>
  <script src="./js/shelf.js"></script>
</body>
</html>
